name: Update paper portfolio prices
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 6:30 PM EDT / 5:30 PM EST, after the close
    - cron: "30 11 * * 2-6"   # 7:30 AM EDT catch-up before the morning email
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch closes
        run: python prices/update_prices.py
      - name: Commit if changed
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices/prices.csv
          git diff --cached --quiet || (git commit -m "Update prices" && git push)
