name: Probe data sources
on:
  push:
    paths: ["probe/**", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install yfinance
      - run: python probe/probe.py
        continue-on-error: true
      - run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add probe/out.txt
          git diff --cached --quiet || (git commit -m "Probe results" && git pull --rebase -q origin main && git push)
